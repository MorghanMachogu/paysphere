# PaySphere: MySQL + PHP API + React frontend.
#   docker compose up -d --build
#   docker compose exec backend php scripts/seed_demo.php   (optional demo data)
#   open http://localhost:8080
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: paysphere
      MYSQL_USER: paysphere
      MYSQL_PASSWORD: ${MORGHAN}
      TZ: Africa/Nairobi
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_NAME: paysphere
      DB_USER: paysphere
      DB_PASS: ${MORGHAN}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-payroll@example.co.ke}
    volumes:
      - backend_logs:/var/www/html/logs

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  mysql_data:
  backend_logs:
